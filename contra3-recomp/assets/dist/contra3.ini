; Contra III (Recompiled) - video enhancements.
; Environment variables CONTRA_INTERP, CONTRA_RES and CONTRA_FPS override these.
[Video]
; 1 = present at your monitor's refresh rate with interpolated in-between
;     frames (game logic stays at the original 60 Hz). 0 = original 60 Hz.
Interpolation = 1
; Internal resolution multiplier, 1-4. Higher values give sub-pixel smooth
; scrolling/sprite motion and HD Mode 7. 4x needs a 6+ core CPU at 144 Hz.
InternalResolution = 2
; Presentation rate in Hz. 0 = match the display. 60/90/120/144/165/240/360.
PresentationHz = 0
