; Contra III (Recompiled) - video enhancements.
; Environment variables CONTRA_INTERP, CONTRA_RES, CONTRA_FPS and CONTRA_AUTOQ
; override these.
[Video]
; 1 = present at your monitor's refresh rate with re-rendered in-between
;     frames (game logic stays at the original 60 Hz). 0 = original 60 Hz.
Interpolation = 1
; Internal resolution. 0 = auto from the screen: 4x (1024x896) at 1080p,
; 1440p and 4K, then smoothly scaled to fill it. Or force 1-4.
; Higher values give sub-pixel smooth scrolling/sprites and HD Mode 7.
InternalResolution = 0
; Presentation rate in Hz. 0 = match the display (60/120/144/165/240/360).
PresentationHz = 0
; 1 = lower the enhancement level automatically if the CPU cannot keep up,
; so the game itself never slows down. 0 = always use the settings above.
AutoQuality = 1
